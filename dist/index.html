<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>商用英文 4000</title>
  <meta name="description" content="通訊電信與商務英文單字卡，搭配間隔重複複習。">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101218" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="商用英文">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // 在載入樣式前套用主題，避免閃爍
    try {
      var s = JSON.parse(localStorage.getItem('biz4000.v1') || '{}');
      var t = s.settings && s.settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" id="topbar">
      <a class="brand" href="#/" aria-label="回首頁">
        <img src="icon.svg" alt="" width="28" height="28">
        <span>商用英文 <b>4000</b></span>
      </a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切換深淺色">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="loading"><div class="spinner"></div><p>載入單字中…</p></div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="主要導覽">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>首頁</span>
      </a>
      <a href="#/study" data-tab="study">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="14" height="16" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v14"/></svg>
        <span>學習</span>
      </a>
      <a href="#/quiz" data-tab="quiz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5L16 9.5"/></svg>
        <span>測驗</span>
      </a>
      <a href="#/browse" data-tab="browse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>字庫</span>
      </a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>設定</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-root" id="modal"></div>

  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
